name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer lint
      - run: composer analyse
      - run: composer generate:status-map
      - run: git diff --exit-code references/cloudflare-status-map.php
      - run: composer lint:plans
      - run: composer test
      # The readiness state machine behind composer test:integration, proved
      # without a database so a broken probe fails here rather than as a flake.
      - run: tools/verify-mysql-readiness.sh
      # composer test:integration brings up its own harness (bin/integration-env.sh:
      # a pd-mysql container on 127.0.0.1:33306 plus a WordPress checkout under
      # tmp/), so the wp-env containers that used to be started here were never
      # contacted by it. .wp-env.json and composer test:integration:wp-env remain
      # for developers who want that environment.
      - run: composer test:integration
