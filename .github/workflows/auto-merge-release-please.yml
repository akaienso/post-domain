name: Auto-merge release PR

# Queues GitHub's native auto-merge on the Release Please release PR, and on
# nothing else. Required checks stay authoritative: auto-merge waits for them,
# so this never merges anything a human merge would not also have to wait for.
#
# pull_request_target runs the trusted copy of this file from the default
# branch, with a token in scope. That is only safe because nothing below ever
# reads the pull request's content: no checkout, no `run` step, no script, no
# expression interpolating a title, body, branch name, or any other
# contributor-controlled string. Every value used for authorization is read
# from the event payload inside a JavaScript step and compared with ===.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: auto-merge-release-please-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    name: Enable auto-merge for the release PR
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Verify identity and enable squash auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;

            // Exact equality on every field. A prefix or "startsWith" match on a
            // title or branch name is not an identity, and anyone able to open a
            // pull request can choose those.
            const EXPECTED = {
              repository: 'akaienso/post-domain',
              author:     'akaienso-release-please[bot]',
              baseRef:    'main',
              headRef:    'release-please--branches--main',
              label:      'autorelease: pending',
            };

            const labels = (pr.labels || []).map(l => l.name);

            const guards = {
              // The head repository, not the base: a fork can name its branch
              // anything, including the release branch's name.
              'head repository': pr.head.repo && pr.head.repo.full_name === EXPECTED.repository,
              'author':          pr.user.login === EXPECTED.author,
              'author is a bot': pr.user.type === 'Bot',
              'base branch':     pr.base.ref === EXPECTED.baseRef,
              'head branch':     pr.head.ref === EXPECTED.headRef,
              'release label':   labels.includes(EXPECTED.label),
              'not a draft':     pr.draft === false,
            };

            const failed = Object.entries(guards)
              .filter(([, ok]) => !ok)
              .map(([name]) => name);

            if (failed.length > 0) {
              core.info(`PR #${pr.number} is not the Release Please release PR.`);
              core.info(`Unmet: ${failed.join(', ')}.`);
              core.info('No auto-merge was requested. A human merges this pull request.');
              return;
            }

            core.info(`PR #${pr.number} matched every Release Please identity check.`);

            // enablePullRequestAutoMerge queues GitHub's own auto-merge; it does
            // not merge now. Required checks decide when, and whether, it lands.
            const query = `
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number autoMergeRequest { enabledAt mergeMethod } }
                }
              }`;

            try {
              const result = await github.graphql(query, { pullRequestId: pr.node_id });
              const request = result.enablePullRequestAutoMerge.pullRequest.autoMergeRequest;
              core.info(`Auto-merge queued (${request.mergeMethod}) at ${request.enabledAt}.`);
            } catch (error) {
              // Already queued, or the PR is in a state GitHub will not queue —
              // for example every required check has already passed and it is
              // mergeable now, or the repository setting is off. None of those
              // should fail the run and none of them merges anything.
              core.warning(`Auto-merge was not queued: ${error.message}`);
            }
